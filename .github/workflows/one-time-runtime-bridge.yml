name: One-time business runtime bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bridge:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect business runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.jsx')
          text = path.read_text(encoding='utf-8')

          import_line = "import { filterModulesForRuntime } from './config/businessRuntime.js';"
          if import_line not in text:
              anchor = "import './styles/app.css';"
              if anchor not in text:
                  raise SystemExit('CSS import anchor not found')
              text = text.replace(anchor, import_line + "\n" + anchor, 1)

          old = """function modulesForBusiness(modules, brand, role) {
  if (role === 'Super Admin') return modules;
  const key = businessTypeKey(brand?.business_type || localStorage.getItem('dsh_business_type') || 'General Store');
  if (key === 'hospital') {
    return modules.filter((item) => HOSPITAL_BUSINESS_MODULES.has(item.id));
  }
  if (key === 'mobile_shop') {
    return modules.filter((item) => MOBILE_SHOP_MODULES.has(item.id));
  }
  if (key === 'pharmacy') {
    return modules.filter((item) => PHARMACY_MODULES.has(item.id));
  }
  if (key === 'traders') {
    return modules.filter((item) => TRADERS_MODULES.has(item.id));
  }
  let scoped = modules.filter((item) => !HOSPITAL_MODULES.has(item.id) && !SUPER_ADMIN_MODULES.has(item.id));
  scoped = scoped.filter((item) => GENERIC_SHOP_MODULES.has(item.id) || (REPAIR_SHOP_TYPES.has(brand?.business_type) && ['repairs', 'repairReceipts'].includes(item.id)));
  return scoped;
}"""
          new = """function modulesForBusiness(modules, brand, role) {
  const roleModules = ROLE_MODULES[role] || ROLE_MODULES.Cashier;
  return filterModulesForRuntime(modules, brand, role, roleModules);
}"""

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Legacy modulesForBusiness block not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify syntax-level source changes
        shell: bash
        run: |
          grep -F "import { filterModulesForRuntime } from './config/businessRuntime.js';" src/main.jsx
          grep -A4 -F "function modulesForBusiness" src/main.jsx

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-runtime-bridge.yml
          git add src/main.jsx .github/workflows/one-time-runtime-bridge.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect business runtime to module filtering"
          git push origin main
